<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sparkimania Records | More Life. More Spark.</title>
  <meta
    name="description"
    content="Sparkimania Records — an independent Nigerian music label built around artists, energy and authentic African sound."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-soft: #10131a;
      --panel: rgba(255, 255, 255, 0.04);
      --panel-strong: rgba(255, 255, 255, 0.08);
      --text: #f4f4f5;
      --text-muted: #b7bdc7;
      --gold: #d8b36c;
      --gold-soft: #f5d895;
      --line: rgba(255, 255, 255, 0.12);
      --shadow: 0 20px 45px rgba(0,0,0,0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(216, 179, 108, 0.10), transparent 28%),
        radial-gradient(circle at bottom right, rgba(255, 255, 255, 0.06), transparent 20%),
        var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(16px);
      background: rgba(10, 10, 15, 0.75);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 78px;
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      gap: 24px;
    }

    .brand {
      font-weight: 900;
      letter-spacing: 0.12em;
      font-size: 0.96rem;
      color: var(--text);
    }

    .brand span {
      color: var(--gold);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 26px;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: var(--text-muted);
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: 0.25s ease;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .nav-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: 0.25s ease;
    }

    .nav-cta:hover {
      background: var(--gold);
      color: #111;
    }

    .hero {
      padding: 70px 0 48px;
    }

    .hero-inner {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      align-items: center;
      gap: 42px;
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.76rem;
      line-height: 1;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold-soft);
      margin-bottom: 18px;
      font-weight: 700;
    }

    h1 {
      font-size: clamp(2.9rem, 6vw, 6rem);
      line-height: 0.93;
      letter-spacing: -0.07em;
      margin-bottom: 18px;
      font-weight: 900;
    }

    h1 .light {
      color: var(--gold-soft);
      display: inline-block;
    }

    .intro {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 560px;
      margin-bottom: 28px;
    }

    .hero-buttons {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 20px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      transition: 0.25s ease;
    }

    .button.primary {
      background: linear-gradient(135deg, var(--gold), var(--gold-soft));
      color: #141414;
      box-shadow: var(--shadow);
    }

    .button.primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 30px rgba(216, 179, 108, 0.22);
    }

    .button.secondary {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.02);
      color: var(--text);
    }

    .button.secondary:hover {
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255,255,255,0.04);
    }

    .hero-visual {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 500px;
      position: relative;
    }

    .brand-mark {
      position: relative;
      width: min(440px, 100%);
      aspect-ratio: 1 / 1;
      border: 1px solid var(--line);
      border-radius: 28px;
      background:
        linear-gradient(135deg, rgba(216, 179, 108, 0.12), rgba(255,255,255,0.02)),
        rgba(255,255,255,0.02);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .brand-mark::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
    }

    .brand-mark .s {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(7rem, 16vw, 15rem);
      font-weight: 900;
      letter-spacing: -0.12em;
      color: rgba(255,255,255,0.12);
      line-height: 1;
    }

    .brand-mark .r {
      position: relative;
      font-size: clamp(5rem, 10vw, 9rem);
      font-weight: 900;
      letter-spacing: -0.08em;
      color: var(--gold-soft);
      text-shadow: 0 0 20px rgba(216, 179, 108, 0.22);
    }

    .section {
      padding: 82px 0;
    }

    .section-head {
      margin-bottom: 34px;
    }

    .section-head h2 {
      font-size: clamp(2rem, 4vw, 3.1rem);
      letter-spacing: -0.06em;
      margin-bottom: 8px;
      line-height: 1;
    }

    .section-head p {
      color: var(--text-muted);
      font-size: 1.02rem;
      max-width: 700px;
    }

    .artist-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .artist-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 26px;
      overflow: hidden;
      transition: 0.25s ease;
      box-shadow: var(--shadow);
    }

    .artist-card:hover {
      transform: translateY(-6px);
      border-color: rgba(216,179,108,0.5);
    }

    .portrait {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 220px;
      background:
        linear-gradient(135deg, rgba(216,179,108,0.18), rgba(255,255,255,0.02)),
        #11151c;
      font-size: clamp(2.4rem, 4vw, 4rem);
      font-weight: 900;
      letter-spacing: -0.08em;
      color: var(--gold-soft);
    }

    .card-body {
      padding: 22px 22px 24px;
    }

    .role {
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold-soft);
      margin-bottom: 14px;
      font-weight: 700;
    }

    .artist-card h3 {
      font-size: 1.7rem;
      letter-spacing: -0.05em;
      margin-bottom: 12px;
    }

    .artist-card p {
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .card-link {
      color: var(--text);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .card-link:hover {
      color: var(--gold-soft);
    }

    .dark-section {
      background: rgba(255,255,255,0.02);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .tracks {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .track {
      display: flex;
      align-items: center;
      gap: 18px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px 22px;
      transition: 0.25s ease;
    }

    .track:hover {
      border-color: rgba(216,179,108,0.5);
      transform: translateY(-2px);
    }

    .track-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(216,179,108,0.12);
      color: var(--gold-soft);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .track b {
      font-size: 1.06rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .about-block {
      max-width: 820px;
    }

    .about-block h2 {
      margin-bottom: 18px;
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      letter-spacing: -0.06em;
      line-height: 1;
    }

    .about-block p {
      color: var(--text-muted);
      margin-bottom: 14px;
      font-size: 1.04rem;
    }

    .highlight {
      margin-top: 20px;
      font-size: 1.4rem;
      color: var(--gold-soft);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .contact-box {
      background: linear-gradient(135deg, rgba(216,179,108,0.08), rgba(255,255,255,0.02));
      border: 1px solid var(--line);
      border-radius: 26px;
      padding: 32px 28px;
    }

    .contact-box h2 {
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.06em;
      margin-bottom: 14px;
    }

    .contact-box p {
      color: var(--text-muted);
      margin-bottom: 22px;
      max-width: 700px;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 30px 0 48px;
      background: rgba(255,255,255,0.01);
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .footer-brand {
      font-weight: 800;
      letter-spacing: 0.12em;
      font-size: 0.82rem;
    }

    .footer-copy {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    @media (max-width: 900px) {
      .hero-inner,
      .artist-grid,
      .tracks {
        grid-template-columns: 1fr;
      }

      .hero-inner {
        display: block;
      }

      .hero-visual {
        margin-top: 28px;
      }

      .nav {
        flex-wrap: wrap;
        padding: 14px 0;
      }

      .nav-links {
